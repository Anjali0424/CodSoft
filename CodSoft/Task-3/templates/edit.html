<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>Edit Given Task</h2>

    <form method="POST" class="add-form">
        <input type="text" name="task" value="{{ task.title }}" required>
        <button type="submit">Update the task</button>
    </form>

    <a href="{{ url_for('index') }}" class="back">⬅ Back</a>
</div>

</body>
</html>

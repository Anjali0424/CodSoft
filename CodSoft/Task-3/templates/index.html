<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>📝 My To-Do List</h2>

    <form method="POST" class="add-form">
        <input type="text" name="task" placeholder="Enter a new task" required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li class="{{ 'done' if task.done }}">
            <span>{{ task.title }}</span>

            <div class="actions">
                {% if not task.done %}
                <a href="{{ url_for('complete', task_id=loop.index0) }}" class="complete">✔</a>
                {% endif %}
                <a href="{{ url_for('edit', task_id=loop.index0) }}" class="edit">✏️</a>
                <a href="{{ url_for('delete', task_id=loop.index0) }}" class="delete">❌</a>
            </div>
        </li>
        {% endfor %}
    </ul>
</div>

</body>
</html>
